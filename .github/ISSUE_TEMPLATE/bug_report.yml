name: Bug Report
description: Something behaves, draws or builds wrong.
title: "[BUG REPORT] "
labels: [bug]
body:
  - type: input
    id: subject
    attributes:
      label: App
      placeholder: TokenLedger
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - elygpui.com showcase page
        - Catalog data or validation
        - CI
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A screenshot or a short recording helps most.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output or error messages.
      render: shell
